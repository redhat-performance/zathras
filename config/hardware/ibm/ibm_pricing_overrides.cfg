# Optional IBM rate overrides for Zathras cost tracking.
# Prices are NOT used unless a matching row is present.
# Catalog lookup (VSI) and the run's instance_cost file take effect first
# unless you set a row here, which always wins.
#
# Columns (whitespace-separated):
#   resource_type  sku  region  unit  hourly_rate  currency
#
# resource_type:
#   vm              IBM VPC VSI (or the compute portion of a GPU profile)
#   gpu             GPU hours split out of a gx* profile
#   volume          Block Storage for VPC, rate is USD per GB-hour
#   floating_ip     VPC floating IP, rate is USD per IP-hour
#
# Example (catalog snapshot; live lookup is preferred when online):
# vm            bx2-4x16          us-south  INSTANCE_HOUR  0.202711  USD
# volume        general-purpose   us-south  GB_HOUR        0.00012025 USD
# floating_ip   standard          us-south  IP_HOUR        0.006     USD
#
# Region may be * to match any region.
