# Optional Azure rate overrides for Zathras cost tracking.
# Prices are NOT used unless a matching row is present.
# A matching row always wins over instance_cost and the Retail Prices API.
#
# Columns (whitespace-separated):
#   resource_type  sku  region  unit  hourly_rate  currency
#
# resource_type:
#   vm              Azure VM (armSkuName, e.g. Standard_D2s_v3)
#   volume          Managed disk; rate is USD per disk-hour (already prorated)
#                   sku is storage_account_type (e.g. Premium_LRS)
#   public_ip       Public IP; rate is USD per IP-hour
#                   sku is Basic or Standard
#
# Example (snapshot; live Retail API is preferred when online):
# vm         Standard_D2s_v3   eastus  INSTANCE_HOUR  0.096000  USD
# volume     Premium_LRS       eastus  DISK_HOUR      0.000274  USD
# public_ip  Basic             eastus  IP_HOUR        0.004000  USD
#
# Region may be * to match any region.
