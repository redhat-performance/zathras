---
#
# Configure SELinux per the requested state/level.
#
# Ubuntu: AppArmor must be stopped and removed before SELinux can be
# installed and activated.
#
- name: Ubuntu enable
  block:
  - name: stop and disable apparmor
    systemd:
      name: apparmor
      state: stopped
      enabled: no
    failed_when: false
  - name: uninstall apparmor
    apt:
      name: apparmor
      state: absent
  - name: reboot the system now for disabled apparmor to take effect
    reboot:
      reboot_timeout: 1800
  - name: install selinux on ubuntu
    apt:
      name:
        - policycoreutils
        - selinux-utils
        - selinux-basics
      state: present
  - name: Activate selinux
    command: "selinux-activate"
  - name: reboot the system now for selinux to be enabled
    reboot:
      reboot_timeout: 1800
  - name: We want permissive for selinux
    command: "setenforce 0"
    when: (config_info.selinux_level == "permissive")
  - name: We want enforcing for selinux
    fail:
      msg: "We do not support enforcing on Ubuntu at this time."
    when: (config_info.selinux_level == "enforcing")
  - name: reboot the system now to get the proper settings
    reboot:
      reboot_timeout: 1800
  when:
    - (ansible_facts.selinux.status == 'disabled')
    - (config_info.selinux_state == "enabled")
    - (config_info.os_vendor == "ubuntu")

- name: RHEL / Amazon selinux
  block:
  #
  # grubby does not put selinux in the boot line by default; when the arg is
  # absent the kernel assumes selinux=1.  We probe the running state with
  # sestatus so we do not depend on gathered facts (the play runs with
  # gather_facts: no).  This task is read-only.
  #
  - name: Get the current selinux state
    shell: "sestatus | grep \"SELinux status\" | cut -d: -f 2 | sed \"s/ //g\""
    register: cur_selinux
    changed_when: false

  - name: general enablement
    block:
    - name: enable selinux RHEL/amazon
      command: 'grubby --update-kernel=ALL --remove-args=selinux'
    #
    # Set the requested mode in the selinux config file.  The replace module
    # is idempotent and cannot truncate the file the way the old
    # cat | sed | mv pipeline could on a failed edit.
    #
    - name: set SELINUX mode in /etc/selinux/config
      replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=.*'
        replace: "SELINUX={{ config_info.selinux_level }}"
    - name: reboot the system now to enable selinux
      reboot:
        reboot_timeout: 1800
    when:
      - (config_info.selinux_state == "enabled")
      - (cur_selinux.stdout != "enabled")

  #
  # Disable selinux at the kernel boot line when we do not want it enabled
  # (selinux_state != "enabled") but it is currently enabled.
  #
  - name: general disablement
    block:
    - name: disabling selinux for RHEL/Amazon
      command: 'grubby --update-kernel=ALL --args=selinux=0'
    - name: reboot the system now for disabled selinux to take effect
      reboot:
        reboot_timeout: 1800
    when:
      - (config_info.selinux_state != "enabled")
      - (cur_selinux.stdout == "enabled")
  when:
    - config_info.os_vendor == "rhel" or config_info.os_vendor == "amazon"
