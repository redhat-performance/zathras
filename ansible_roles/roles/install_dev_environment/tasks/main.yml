---
# tasks file for install_dev_environment
#
# Installs the RHEL "Development Tools" group. Callers already gate this on
# os_vendor == "rhel", and install_packages only runs its RHEL branch for RHEL.
#
- name: install dev tools
  include_role:
    name: install_packages
  vars:
    results_file: "/tmp/dev_env_status"
    pkg_install: "@Development Tools"
