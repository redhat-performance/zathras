---
#
# Upload and install the requested rpms.
#

- name: include_rpms
  include_vars:
    file: "{{ working_dir }}/upload_rpms.yml"
    name: rpms

- name: Load in configuration information
  include_vars:
    file: "{{ working_dir }}/ansible_vars.yml"

#
# Walk the list of rpms and upload/install each one.
# A value of "none" is the sentinel for "no rpm requested" and is skipped.
#
- name: perform rpm upload
  include_role:
    name: rpm_upload_and_install
  vars:
    rpm: "{{ rpm_file }}"
  when: rpm_file != "none"
  loop:  "{{ rpms.rpm | default([]) }}"
  loop_control:
    loop_var: rpm_file
