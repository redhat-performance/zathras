---
# tasks file for retrieving the status of the last operation
#

#
# The status file is read from status_src_dir (default /tmp), which must
# match where record_status wrote it.  fail_on_missing is off so an absent
# status file is treated as "no status" rather than aborting the play.
#
- name: retrieve status file
  fetch:
    src: "{{ status_src_dir | default('/tmp') }}/{{ status_file }}"
    dest: "{{ working_dir }}/{{ status_file }}"
    flat: yes
    fail_on_missing: no
