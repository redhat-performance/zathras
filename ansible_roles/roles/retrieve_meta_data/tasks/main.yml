---
#
# Retrieve the system meta data for azure/gcp.  As AWS is via a cli not curl,
# we do that from the aws code itself.
#
- name: Retrieve the azure meta data
  block:
    #
    # ansible builtin install is not working on azurelinux at this time,
    # use dnf instead.  Everywhere else use the package module so the
    # install is idempotent and retried.
    #
  - name: Install jq (azurelinux workaround)
    shell: "dnf install -y jq"
    when: config_info.os_vendor == "azure"
  - name: Install jq
    ansible.builtin.package:
      name: jq
      state: latest
    register: jq_installed
    until: jq_installed is succeeded
    retries: 5
    delay: 10
    when: config_info.os_vendor != "azure"
  - name: Grab the metadata
    shell: curl -s -H Metadata:true --noproxy "*" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" | jq > /tmp/meta_data.yml
  - name: retrieve the azure metadata
    fetch:
      src: "/tmp/meta_data.yml"
      dest: "{{ working_dir }}/meta_data.yml"
      flat: yes
  rescue:
    - name: Report Error
      lineinfile:
        path: "{{ results_file | default(working_dir + '/meta_data_status') }}"
        regexp: '^status:'
        line: "status: failed to grab metadata"
        create: yes
  when:
    - config_info.system_type == "azure"

- name: Retrieve the gcp meta data
  block:
  - name: Install jq
    ansible.builtin.package:
      name: jq
      state: latest
    register: jq_installed
    until: jq_installed is succeeded
    retries: 5
    delay: 10
  - name: Grab the metadata
    shell: curl -H Authorization:Bearer $(gcloud auth print-identity-token) -H Metadata-Flavor:Google 'http://metadata.google.internal/computeMetadata/v1/instance/?recursive=true' | jq > /tmp/meta_data.yml
  - name: retrieve the gcp metadata
    fetch:
      src: "/tmp/meta_data.yml"
      dest: "{{ working_dir }}/meta_data.yml"
      flat: yes
  rescue:
    - name: Report Error
      lineinfile:
        path: "{{ results_file | default(working_dir + '/meta_data_status') }}"
        regexp: '^status:'
        line: "status: failed to grab metadata"
        create: yes
  when:
    - config_info.system_type == "gcp"
