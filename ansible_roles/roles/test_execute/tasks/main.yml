---
#
# We could combine this with test_generic, but the file
# would get a bit long.
#
# Note: the per-test variable data (test_data) and the dynamic run
# variables (dyn_data) are loaded by test_generic itself, so there is
# no need to include them here.
#
- name: check to see if git command is present
  shell:
      cmd: "command -v git"
  register: git_check
  changed_when: false
  failed_when: false

#
# Install git if it is missing.  Seeing issue on various os's where the ansible command fails
# because there is extra data returned after ansible thinks all the data has been returned.
# This results in the ansible thinking the command has failed.  Tried the various recommend fixes,
# did not clear out the error.  Soloution is to use the installer for the particular os.
#
- name: install git
  block:
  - name: Determine OS package manager
    block:
      - name: Use dnf
        set_fact:
          pkg_man: dnf
        when: config_info.os_vendor in ["azure", "rhel", "amazon"]
      - name: Use apt
        set_fact:
          pkg_man: apt
        when: config_info.os_vendor == "ubuntu"
      - name: Use zypper
        set_fact:
          pkg_man: zypper
        when: config_info.os_vendor == "suse"
  - name: Build dependency list
    set_fact:
      pkgs:
        - git
  - name: Install packages
    ansible.builtin.command: "{{ pkg_man }} install -y {{ item }}"
    loop: "{{ pkgs }}"
  rescue:
    - name: If git not installed or failed to install bail.
      include_role:
        name: tf_delete
      vars:
        tf_dir: "tf"
    - name: Aborting test
      fail:
        msg: "Git is not present"
  when:
    - git_check.rc != 0
    - config_info.do_not_install_packages == 0
    - config_info.do_not_install_system_packages == 0

#
# Time we are starting the test.
#
- name: grab test start time
  command: "date +%s"
  register: start_time
  changed_when: false
#
# Execute the test.
#
- name: test_execution
  include_role:
    name: test_generic
  vars:
    test_exec_location: "{{ test_exec_loca }}"
    test_def_file: "tests_to_run/{{ test_exec }}.yml"
    test_name: "{{ test_exec }}"

#
# Time we are ending the test.
#
- name: grab test end time
  command: "date +%s"
  register: end_time
  changed_when: false

#
# Report the time to run the test.
#
- name: record test date
  shell: "echo 'test: {{ test_item }} execution time {{ (end_time.stdout | int) - (start_time.stdout | int) }}' >> /tmp/test_times"
  changed_when: true
  when: config_info.cloud_execute_tests == 1

- name: retrieve test time
  fetch:
    src: "/tmp/test_times"
    dest: "{{ working_dir }}/test_times"
    flat: yes
  when: config_info.cloud_execute_tests == 1
