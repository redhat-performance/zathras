---
# tasks file for roles/ssh_key_exchange
- name: SSH KeyGen command
  delegate_to: "{{ item }}"
  become: yes
  shell: >
    ssh-keygen -q -b 2048 -t rsa -N "" -C "creating SSH" -f ~/.ssh/id_rsa
    creates="~/.ssh/id_rsa"
  with_items:
    - "{{ ip_list }}"

- name: Fetch the keyfile from one server to another
  delegate_to: "{{ item }}"
  become: yes
  fetch:
    src: "~/.ssh/id_rsa.pub"
    dest: "buffer/{{item}}-id_rsa.pub"
    flat: yes
  with_items:
    - "{{ ip_list }}"

#
# Full mesh: add every host's public key to every host's authorized_keys
# (including its own).  Generalizes the exchange to any number of hosts in
# ip_list rather than assuming exactly two.
#
- name: Add each host key to every host authorized_keys
  delegate_to: "{{ item[0] }}"
  become: yes
  authorized_key:
    user: root
    state: present
    key: "{{ lookup('file', 'buffer/' + item[1] + '-id_rsa.pub') }}"
  loop: "{{ ip_list | product(ip_list) | list }}"
  loop_control:
    label: "{{ item[1] }} -> {{ item[0] }}"

- name: Permit root login
  delegate_to: "{{ item }}"
  become: yes
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: PermitRootLogin yes
  with_items:
    - "{{ ip_list }}"

- name: restart sshd service
  delegate_to: "{{ item }}"
  become: yes
  systemd:
    name: sshd
    state: restarted
  with_items:
    - "{{ ip_list }}"

- name: Make sure we can ssh in to net1 from net2
  delegate_to: "{{ ip_list[1] }}"
  become: yes
  shell: "ssh -oStrictHostKeyChecking=no root@{{ ip_list[0] }} 'cat /etc/passwd'"
  changed_when: false

- name: Make sure we can ssh in net2 from net1
  delegate_to: "{{ ip_list[0] }}"
  become: yes
  shell: "ssh -oStrictHostKeyChecking=no root@{{ ip_list[1] }} 'cat /etc/passwd'"
  changed_when: false
