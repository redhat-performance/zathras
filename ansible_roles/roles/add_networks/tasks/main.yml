---
#
# Add in network info for terraform.
#
# Appends the "system" locals block consumed by the cloud main.tf files
# (for_each = local.system, reading each.value.index / each.value.sys).
# Rendered from templates/system_locals.j2 and inserted with blockinfile so
# the task is idempotent instead of blindly echo-appending on every run.
#
- name: add in system locals for terraform
  blockinfile:
    path: "{{ working_dir }}/tf/main.tf"
    marker: "# {mark} ANSIBLE MANAGED BLOCK add_networks"
    block: "{{ lookup('template', 'system_locals.j2') }}"
